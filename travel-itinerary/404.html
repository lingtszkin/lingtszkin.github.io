<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Travel Itinerary</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Stores the full path after the base and redirects to the app root
    var base = '/travel-itinerary'
    var loc = window.location
    var path = loc.pathname.startsWith(base)
      ? loc.pathname.slice(base.length) || '/'
      : loc.pathname
    var redirect = path + loc.search + loc.hash
    sessionStorage.setItem('spa-redirect', redirect)
    loc.replace(base + '/')
  </script>
</head>
<body></body>
</html>
