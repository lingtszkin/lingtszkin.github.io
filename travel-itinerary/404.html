<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect: store the path and redirect to index
    const path = window.location.pathname.replace('/travel-itinerary', '') || '/'
    sessionStorage.setItem('spa-redirect', path + window.location.search)
    window.location.replace('/travel-itinerary/')
  </script>
</head>
<body></body>
</html>
